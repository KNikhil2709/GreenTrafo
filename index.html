// ---------- Plan tab ----------
function PlanTab({ network, scenario, setScenario, onTransfer, onInvalidate }) {
  const [budget, setBudget] = useState({ capexInr: 2400000, upgrades: 8, mobileUnits: 3 });
  const [result, setResult] = useState(null);
  const [profile, setProfile] = useState("balanced");
  const [selIdx, setSelIdx] = useState(null);
  const [busy, setBusy] = useState(false);
  const [runError, setRunError] = useState(null);
  const previousRun = useRef(null);
  const runTimer = useRef(null);
  useEffect(() => () => clearTimeout(runTimer.current), []);
  const [hover, setHover] = useState(null);
  const [copied, setCopied] = useState(false);

  const forecast = useMemo(() => buildGrowthForecast(network), [network]);
  // Plan against an upper-plausible growth outcome; the detail view still exposes
  // the entire fitted uncertainty range so the conservative choice is explicit.
  const planningNetwork = useMemo(() => networkAtForecastQuantile(network, forecast, "p90"), [network, forecast]);
  const preview = useMemo(() => evaluatePlan(planningNetwork, scenario, {}), [planningNetwork, scenario]);

  function changeBudget(key, value) {
    onInvalidate();
    setBudget(current => ({ ...current, [key]: value }));
    setResult(null); setSelIdx(null); setCopied(false); setRunError(null);
  }

  const canWarmStart = previousRun.current && previousRun.current.network === planningNetwork &&
    previousRun.current.scenario === scenario &&
    Object.keys(budget).some(key => budget[key] !== previousRun.current.result.budget[key]);

  function run() {
    onInvalidate();
    setBusy(true); setRunError(null); setCopied(false);
    const archive = canWarmStart ? previousRun.current.result.archive : null;
    // Yield once so the busy state paints; the search itself is synchronous.
    // Warm starts retain valid simulation cache entries and use 20 generations.
    if (!archive) clearSimCache();
    runTimer.current = setTimeout(() => {
      try {
        const started = performance.now();
        const res = runPlan(planningNetwork, scenario, budget, network.seed, archive ? 20 : 60, 40, { archive });
        const elapsedMs = performance.now() - started;
        previousRun.current = { network: planningNetwork, scenario, result: res };
        setResult({ ...res, elapsedMs });
        const idx = res.pareto.indexOf(res.profiles.balanced);
        setProfile("balanced"); setSelIdx(idx >= 0 ? idx : 0);
      } catch (error) {
        setRunError(error.message); setResult(null); previousRun.current = null;
      } finally { setBusy(false); }
    }, 30);
  }

  function copyPlan() {
    if (!chosen || !green) return;
    const text = [
      `GreenTrafo — Plan summary`,
      `Simulated data; assumed action costs`,
      `Scenario: ${SCENARIOS[scenario].label}`,
      `Profile: ${profile}`,
      `Search: ${result.search.mode === "warm" ? "Warm start" : "Fresh search"}; ${result.search.reusedPlans} plans reused; ${result.search.generations} generations`,
      `Budget cap: ₹${fmtL(result.budget.capexInr)} (same cap and resource limits for both policies)`,
      `Unspent: ₹${fmtL(result.budget.capexInr - chosen.capexInr)}`,
      `Capex: ₹${fmtL(chosen.capexInr)}  (baseline ₹${fmtL(result.baseline.capexInr)})`,
      `Loss of life: ${chosen.lossOfLifeHours.toFixed(1)} h  (baseline ${result.baseline.lossOfLifeHours.toFixed(1)} h)`,
      `Overload hours: ${chosen.overloadHours.toFixed(0)} h  (baseline ${result.baseline.overloadHours.toFixed(0)} h)`,
      `Actions applied: ${Object.values(chosen.perT).filter(x => x.action !== 'none').length}`,
      `Avoided replacements: ${green.avoidedReplacements}`,
      `Diesel hours avoided: ${green.dieselHoursAvoided.toFixed(1)} h`,
    ].join('\n');
    navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  }

  const chosen = result && selIdx != null ? result.pareto[selIdx] : null;
  const perT = chosen ? chosen.perT : preview.perT;
  const green = useMemo(() => result ? greenOutcomes(planningNetwork, scenario, chosen, result.baseline) : null,
    [result, chosen, planningNetwork, scenario]);

  function pickProfile(key) {
    setProfile(key);
    const p = result.profiles[key];
    setSelIdx(result.pareto.indexOf(p));
  }

  // reason for the hovered transformer's action
  const reason = hover && perT[hover] ? perT[hover] : null;

  const steps = [
    { label: "Load feeder", state: "done" },
    { label: "Set scenario & budget", state: "done" },
    { label: "Optimise plans", state: result ? "done" : "active" },
    { label: "Compare vs baseline", state: result ? "active" : "" },
  ];
  const delta = (plan, base) => { if (base === 0) return null; return Math.round((plan - base) / base * 100); };

  return (
    <>
      <StepStrip steps={steps} />
      {green && <GreenStrip green={green} />}
      <div className="wrap"><main><div className="grid">
        {/* LEFT: controls */}
        <div className="railL">
          <div className="card">
            <h2>Plan before summer</h2>
            <div className="sub">Choose actions within a fixed rupee budget.</div>
            <div className="field">
              <label>Scenario</label>
              <div className="seg wrap2">
                {SCEN_KEYS.map(k => <button key={k} disabled={busy} aria-pressed={scenario === k}
                  onClick={() => { onInvalidate(); setScenario(k); setResult(null); setCopied(false); setRunError(null); previousRun.current = null; }}>{SCENARIOS[k].label}</button>)}
              </div>
            </div>
            <div className="field">
              <label htmlFor="capex-budget">Capex budget <span className="v">₹{fmtL(budget.capexInr)}</span></label>
              <input id="capex-budget" type="range" min="0" max="6000000" step="100000" disabled={busy} value={budget.capexInr}
                onChange={e => changeBudget("capexInr", +e.target.value)} />
              <div className="hint">All actions count: upgrades ₹1.8–3L, rebalance ₹0.4L, mobile ₹1.2L. Assumed costs.</div>
            </div>
            <div className="field">
              <label htmlFor="upgrade-limit">Maximum upgrades <span className="v">{budget.upgrades}</span></label>
              <input id="upgrade-limit" type="range" min="0" max="16" disabled={busy} value={budget.upgrades}
                onChange={e => changeBudget("upgrades", +e.target.value)} />
            </div>
            <div className="field">
              <label htmlFor="mobile-limit">Maximum mobile units <span className="v">{budget.mobileUnits}</span></label>
              <input id="mobile-limit" type="range" min="0" max="8" disabled={busy} value={budget.mobileUnits}
                onChange={e => changeBudget("mobileUnits", +e.target.value)} />
            </div>
            <button className="btn" disabled={busy} onClick={run}>
              {busy ? "Optimising…" : canWarmStart ? "Re-plan from previous plans" : result ? "Re-optimise plans" : "Run optimiser"}</button>
            {canWarmStart && !busy && <div className="hint" style={{ marginTop: 10 }}>Previous plans will be adapted to these limits. A shorter search will explore alternatives.</div>}
            {runError && <div role="alert" className="callout" style={{ marginTop: 10 }}>Could not optimise: {runError}. Try a fresh run.</div>}
            {result && <div className="reason" role="status" data-testid="search-summary">
              <b>{result.search.mode === "warm" ? "Warm start" : "Fresh search"}</b> · {(result.elapsedMs / 1000).toFixed(2)} s<br />
              {result.search.reusedPlans} previous plans reused · {result.search.repairedPlans} adjusted to fit · {result.search.generations} generations.
              <div className="hint">Change the budget or resource limits to re-plan. Re-running unchanged settings starts fresh. Plans are kept only while this tab stays open.</div>
            </div>}
            {result && !busy && <div className="hint" style={{ marginTop: 10 }}>
              Pareto front of {result.pareto.length} plans. Point size = overload hours.</div>}
          </div>
          <div className="card" style={{ marginTop: 14 }}>
            <h2>Growth forecast</h2>
            <div className="sub">Fitted quantile regression · synthetic calibration</div>
            <div className="metric-grid">
              <div className="mstat good"><div className="n">{forecast.calibration.samples}</div><div className="l">synthetic historic readings</div></div>
              <div className="mstat good"><div className="n">{Math.round(forecast.calibration.coverage * 100)}%</div><div className="l">synthetic p10–p90 coverage</div></div>
            </div>
            <div className="hint" style={{ marginTop: 9 }}>Plan uses each transformer's p90 prediction. Tap a feeder node to inspect its p10, median, and p90 forecast.</div>
            <div className="hint" style={{ marginTop: 9 }}>Synthetic history shares latent growth with the evaluation targets; coverage is not an independent accuracy estimate.</div>
          </div>
          {result && <div className="card" style={{ marginTop: 14 }}>
            <h2>Optimiser convergence</h2>
            <div className="sub">Pareto quality over generations.</div>
            <Convergence history={result.history} />
          </div>}
        </div>

        {/* CENTER: map */}
        <div className="card mapcard">
          <div className="maphead">
            <div>
              <h2>Distribution feeder</h2>
              <div className="sub">{network.transformers.length} transformers · {SCENARIOS[scenario].label} · tap a node for details</div>
            </div>
            <span className="simbadge">Simulated data</span>
          </div>
          <FeederMap network={network} perT={perT} selected={hover} onSelect={setHover} mode="risk" />
          <MapLegend mode="risk" />
        </div>

        {/* RIGHT: result cards + transformer detail */}
        <div className="railR">
          {hover && <TransformerDetail transformerId={hover} network={network} scenario={scenario} perT={perT} forecast={forecast} />}
          {!result && <div className="card"><h2>Route plans</h2>
            <div className="sub">Run the optimiser to see the Pareto-optimal plans, scored against the 80% / 90% baseline.</div>
            <div className="hint">Each plan trades capex against overload hours and transformer loss-of-life. Tap any transformer for a detail view.</div>
          </div>}
          {result && <>
            <div className="card" style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                <h2>Plan options</h2>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <span className="ribbon">{result.pareto.length} Pareto-optimal</span>
                  <button onClick={copyPlan} title="Copy plan summary to clipboard"
                    style={{ background: copied ? 'rgba(61,205,88,0.18)' : 'rgba(255,255,255,0.06)', border: '1px solid var(--line)', borderRadius: 8, padding: '3px 10px', fontSize: 11.5, color: copied ? 'var(--green-br)' : 'var(--ink-2)', cursor: 'pointer' }}>
                    {copied ? '✓ Copied' : '📋 Copy'}
                  </button>
                </div>
              </div>
              <div className="sub">NSGA-II · {result.pareto.length} plans · deltas vs the 80/90 baseline.</div>
              <ParetoChart pareto={result.pareto} selIdx={selIdx} onPick={i => { setSelIdx(i); setProfile("custom"); }} baseline={result.baseline} />
            </div>
            {[["lowestCost", "Lowest cost"], ["balanced", "Balanced"], ["mostReliable", "Most reliable"]].map(([k, l]) => {
              const p = result.profiles[k]; const b = result.baseline;
              const dc = delta(p.capexInr, b.capexInr), dl = delta(p.lossOfLifeHours, b.lossOfLifeHours), dov = delta(p.overloadHours, b.overloadHours);
              const D = (v) => v == null ? null : <span className={"d " + (v <= 0 ? "pos" : "neg")}>{v > 0 ? "+" : ""}{v}%</span>;
              return (
                <div key={k} className="rc" aria-pressed={profile === k} onClick={() => pickProfile(k)}>
                  <div className="rh"><span className="nm">{l}</span>
                    {k === "lowestCost" && p.capexInr === result.profiles.balanced.capexInr && <span className="pr">cheapest option</span>}</div>
                  <div className="rg">
                    <div className="cell"><div className="cl">Capex</div><div className="cv">{fmtL(p.capexInr)} {D(dc)}</div></div>
                    <div className="cell"><div className="cl">Loss of life</div><div className="cv">{p.lossOfLifeHours.toFixed(1)}h {D(dl)}</div></div>
                    <div className="cell"><div className="cl">Overload</div><div className="cv">{p.overloadHours.toFixed(0)}h {D(dov)}</div></div>
                    <div className="cell"><div className="cl">Actions</div><div className="cv">{Object.values(p.perT).filter(x => x.action !== "none").length}</div></div>
                  </div>
                </div>
              );
            })}
            <div className="card" style={{ marginTop: 2 }}>
              <h2>This plan vs the 80% / 90% rule</h2>
              <div className="sub">Same ₹{fmtL(result.budget.capexInr)} cap and resource limits. Actual spend may differ; this is not an equal-spend comparison.</div>
              <div className="reason" data-testid="budget-summary" style={{ marginBottom: 12 }}>
                <b>Selected plan: ₹{fmtL(chosen.capexInr)} spent</b> · ₹{fmtL(result.budget.capexInr - chosen.capexInr)} unspent.<br />
                80/90 rule: ₹{fmtL(result.baseline.capexInr)} spent · ₹{fmtL(result.budget.capexInr - result.baseline.capexInr)} unspent.
                {budget.capexInr === 0 && <div>Zero budget: both policies take no action.</div>}
              </div>
              <CompareBars plan={chosen} base={result.baseline} />
              <button className="btn" disabled={busy} onClick={() => onTransfer({
                ...createProtectPlan(planningNetwork, scenario, chosen.actions), profile,
                budget: { ...result.budget }, demand: "p90"
              })}>Use this plan in Protect</button>
              <div className="hint" style={{ marginTop: 8 }}>Carry this selection and its p90 demand assumptions into the evening simulation.</div>
            </div>
          </>}
        </div>
      </div></main></div>
    </>
  );
}

function CompareBars({ plan, base }) {
  const rows = [
    ["Capex", plan.capexInr / 1e5, base.capexInr / 1e5, "₹L", 1],
    ["Loss of life", plan.lossOfLifeHours, base.lossOfLifeHours, "h", 1],
    ["Overload", plan.overloadHours, base.overloadHours, "h", 1],
  ];
  const fmt = (v, u) => u === "₹L" ? "₹" + v.toFixed(1) + "L" : v.toFixed(1) + " " + u;
  return (
    <div className="cmp">
      {rows.map(([lab, pv, bv, u]) => {
        const max = Math.max(pv, bv, 0.0001);
        return (
          <div key={lab} className="crow">
            <div className="cl"><span>{lab}</span><span className="tag">plan vs baseline</span></div>
            <div className="bar plan"><i style={{ width: (pv / max * 100) + "%" }} /></div>
            <div className="cl" style={{ margin: "3px 0" }}><span className="tag">this plan</span>
              <span style={{ fontWeight: 600 }}>{fmt(pv, u)}</span></div>
            <div className="bar base"><i style={{ width: (bv / max * 100) + "%" }} /></div>
            <div className="cl" style={{ margin: "3px 0 0" }}><span className="tag">80/90 rule</span>
              <span>{fmt(bv, u)}</span></div>
          </div>
        );
      })}
    </div>
  );
}

// ---------- Protect tab ----------
function ProtectTab({ network: originalNetwork, transferredPlan, onClearPlan }) {
  const [scenario, setScenario] = useState(transferredPlan?.scenario ?? "highEV");
  const [usePlan, setUsePlan] = useState(true);
  const plan = transferredPlan?.scenario === scenario ? transferredPlan : null;
  const network = plan ? (usePlan ? plan.after : plan.before) : originalNetwork;
  function changeScenario(value) {
    if (value !== scenario) { onClearPlan(); setUsePlan(true); }
    setScenario(value);
  }
  // rank transformers by how much their EVENING EV load pushes them toward the hot-spot limit,
  // preferring ones where flexible load is the swing factor (base load alone stays under limit).
  // Returns { ids: string[], empty: bool }
  const { risky, riskyAll } = useMemo(() => {
    const candidates = network.transformers
      .filter(t => t.evCount >= 2)
      .map(t => {
        const un = runProtect(network, scenario, t.id, network.seed);
        return { id: t.id, swing: un.overLimitUnmanaged, base: un.baseOverLimit };
      });
    // primary: EVs cause the breach and base load does not
    const strict = candidates
      .filter(x => x.swing > 0 && x.base < 0.6)
      .sort((a, b) => b.swing - a.swing)
      .slice(0, 8).map(x => x.id);
    // fallback for mild scenarios: top-8 by unmanaged overload even if base load is also over
    const fallback = candidates
      .filter(x => x.swing > 0)
      .sort((a, b) => b.swing - a.swing)
      .slice(0, 8).map(x => x.id);
    // ultimate fallback: top-8 busiest transformers (so UI never crashes)
    const busiest = [...network.transformers]
      .sort((a, b) => b.evCount - a.evCount)
      .slice(0, 8).map(t => t.id);
    const ids = strict.length ? strict : fallback.length ? fallback : busiest;
    return { risky: ids, riskyAll: candidates };
  }, [network, scenario]);

  // sel is always derived from risky so it can never be stale/undefined
  const [_sel, setSel] = useState(null);
  const sel = (plan ? network.transformers.some(t => t.id === _sel) : risky.includes(_sel)) ? _sel : (risky[0] ?? null);

  const [managed, setManaged] = useState(true);
  const [step, setStep] = useState(72); // 18:00
  const playing = useRef(false);
  const [, force] = useState(0);
  useEffect(() => () => { playing.current = false; }, []);

  // keep _sel in sync when scenario changes
  useEffect(() => { setSel(risky[0] ?? null); }, [scenario]);

  // guard: don't call runProtect when sel is null (can happen in extreme edge cases)
  const pr = useMemo(() => sel ? runProtect(network, scenario, sel, network.seed) : null, [network, scenario, sel]);
  const hs = pr ? (managed ? pr.managed.hotSpot : pr.unmanaged.hotSpot) : [];

  // scenario label hint when there are no naturally at-risk transformers
  const isMildScenario = useMemo(() => {
    return !riskyAll.some(x => x.swing > 0 && x.base < 0.6);
  }, [riskyAll]);

  function play() {
    if (playing.current) { playing.current = false; force(x => x + 1); return; }
    playing.current = true; force(x => x + 1);
    const tick = () => {
      if (!playing.current) return;
      setStep(s => { const n = s + 1; if (n >= pr.managedKw.length) { playing.current = false; force(x => x + 1); return pr.managedKw.length - 1; } return n; });
      setTimeout(tick, 60);
    };
    tick();
  }

  const hotSpotNow = {};
  network.transformers.forEach(t => { hotSpotNow[t.id] = null; });
  if (sel && hs.length) hotSpotNow[sel] = hs[step];

  const hourLabel = (() => { const h = step * 0.25; const hh = Math.floor(h) % 24; const mm = Math.round((h % 1) * 60); return (h >= 24 ? "+1d " : "") + String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); })();

  const steps = [
    { label: "Forecast the evening", state: "done" },
    { label: "Flag at-risk transformer", state: "done" },
    { label: "Schedule flexible load", state: managed ? "done" : "active" },
    { label: "Verify under limit", state: managed ? "active" : "" },
  ];

  if (!sel || !pr) {
    return (
      <div className="wrap" style={{ paddingTop: 40 }}>
        <div className="card prose" style={{ maxWidth: 560, margin: "0 auto", textAlign: "center" }}>
          <h2>No at-risk transformers in this scenario</h2>
          <p>In the <b>{SCENARIOS[scenario].label}</b> scenario, no transformer is pushed over the 110 °C hot-spot limit by EV charging alone. Try <b>Hot summer</b> or <b>High EV growth</b> to see the Protect module in action.</p>
          <div className="seg" style={{ marginTop: 16, maxWidth: 320, marginLeft: "auto", marginRight: "auto" }}>
            {SCEN_KEYS.filter(k => k !== scenario).map(k =>
              <button key={k} onClick={() => changeScenario(k)}>{SCENARIOS[k].label}</button>)}
          </div>
        </div>
      </div>
    );
  }

  return (
    <>
      <StepStrip steps={steps} />
      {isMildScenario && <div className="greenstrip" style={{ background: "rgba(242,193,46,0.06)", borderBottom: "1px solid rgba(242,193,46,0.25)" }}><div className="wrap" style={{ padding: "8px 22px", fontSize: 12, color: "#E8D9A8" }}>{riskyAll.some(x => x.swing > 0) ? "Baseline load already stresses these units; EVs are not the sole cause. Showing affected transformers." : "No unmanaged thermal breaches among the EV candidates. Showing busy transformers for inspection."}</div></div>}
      <GreenStrip
        green={{
          avoidedReplacements: pr.overLimitManaged < pr.overLimitUnmanaged ? 1 : 0,
          dieselHoursAvoided: Math.max(0, pr.overLimitUnmanaged - pr.overLimitManaged),
          EOL: 1.6, dieselShare: 0.4
        }}
        extra={{ kwh: pr.peakKwhShifted.toFixed(0) }} />
      <div className="wrap"><main><div className="grid">
        {/* LEFT: controls */}
        <div className="railL">
          <div className="card">
            <h2>Protect the evening</h2>
            <div className="sub">Schedule EV & AC flexibility through the next morning.</div>
            <div className="field">
              <label>Scenario</label>
              <div className="seg wrap2">
                {SCEN_KEYS.map(k => <button key={k} aria-pressed={scenario === k} onClick={() => changeScenario(k)}>{SCENARIOS[k].label}</button>)}
              </div>
            </div>
            {plan && <div className="reason" data-testid="transferred-plan" style={{ marginBottom: 14 }}>
              <b>Plan: {({ lowestCost: "Lowest cost", balanced: "Balanced", mostReliable: "Most reliable", custom: "Custom selection" })[plan.profile]}</b><br />
              {SCENARIOS[plan.scenario].label} · ₹{fmtL(plan.capexInr)} spent · {Object.values(plan.actions).filter(a => a !== "none").length} actions<br />
              Same p90 demand and EV sessions in both views. Unmanaged, ToU and Managed all use the network selected below.
              <div className="seg" style={{ marginTop: 8 }}>
                <button aria-pressed={usePlan} onClick={() => setUsePlan(true)}>Selected plan</button>
                <button aria-pressed={!usePlan} onClick={() => setUsePlan(false)}>Without plan</button>
              </div>
              <button onClick={onClearPlan} style={{ marginTop: 8, padding: "5px 10px", borderRadius: 8,
                background: "var(--panel)", color: "var(--ink)", border: "1px solid var(--line)" }}>Remove plan</button>
              <div className="hint">Removing the plan returns to standalone demand. Changing scenario also removes it.</div>
            </div>}
            {!plan && <div className="hint" data-testid="standalone-protect" style={{ marginBottom: 14 }}>Standalone simulation · no Plan actions applied. Choose a plan in Plan to carry its actions here.</div>}
            <div className="field">
              <label>At-risk transformer</label>
              <div className="seg wrap2">
                {risky.slice(0, 4).map(id => <button key={id} aria-pressed={sel === id} onClick={() => setSel(id)}>{id}</button>)}
              </div>
            </div>
            {plan && <div className="field">
              <label htmlFor="inspect-transformer">Inspect any transformer</label>
              <select id="inspect-transformer" value={sel} onChange={e => setSel(e.target.value)} style={{ width: "100%", padding: 8, background: "var(--panel)", color: "var(--ink)", border: "1px solid var(--line)", borderRadius: 8 }}>
                {network.transformers.map(t => <option key={t.id} value={t.id}>{t.id} · {plan.actions[t.id]}</option>)}
              </select>
              <div className="reason" data-testid="applied-action">
                {sel} · {usePlan ? plan.actions[sel] : "none"} · {network.transformers.find(t => t.id === sel)?.rating} kVA<br />
                {usePlan ? "Selected plan actions applied once." : "Before plan actions; same p90 demand."}
              </div>
            </div>}
            <div className="field">
              <label>Control</label>
              <div className="seg">
                <button aria-pressed={!managed} onClick={() => setManaged(false)}>Unmanaged</button>
                <button aria-pressed={managed} onClick={() => setManaged(true)}>Managed</button>
              </div>
            </div>
            <div className="field" style={{ marginBottom: 0 }}>
              <label>Replay · today through tomorrow noon</label>
              <div className="slider-row">
                <button className="playbtn" onClick={play}>{playing.current ? "❚❚" : "▶"}</button>
                <input aria-label="Overnight replay time" type="range" min="0" max={pr.managedKw.length - 1} value={step} onChange={e => setStep(+e.target.value)} />
                <span className="clock">{hourLabel}</span>
              </div>
            </div>
          </div>
          <div className="card" style={{ marginTop: 14 }}>
            <h2>Why it works</h2>
            <div className="hint">{sel} has {pr.sessions} EV sessions tonight. Managed charging fills the cool
              early-morning hours and trims AC in the hottest window. Check the measured on-time share and time above the limit below; thermal safety is not guaranteed. {plan && "Savings here measure scheduling against unmanaged charging on the selected network, not the total benefit of Plan."}</div>
          </div>
        </div>

        {/* CENTER: map */}
        <div className="card mapcard">
          <div className="maphead">
            <div>
              <h2>Peak-evening thermal state</h2>
              <div className="sub">{SCENARIOS[scenario].label} · {sel} selected · {hourLabel}{plan ? (usePlan ? " · Plan applied · p90" : " · Before plan · p90") : ""}</div>
            </div>
            <span className="simbadge">Simulated data</span>
          </div>
          <FeederMap network={network} perT={plan && usePlan ? Object.fromEntries(Object.entries(plan.actions).map(([id, action]) => [id, { action }])) : null}
            selected={sel} onSelect={id => { if (plan || risky.includes(id)) setSel(id); }}
            mode="thermal" hotSpotById={hotSpotNow} />
          <MapLegend mode="thermal" />
        </div>

        {/* RIGHT: temperature + metrics */}
        <div className="railR">
          <div className="card" style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
              <h2>Hot-spot temperature tonight</h2>
              <span className="ribbon" style={{ color: managed ? "var(--green-br)" : "var(--neg)", borderColor: managed ? "var(--line-2)" : "rgba(226,76,76,0.4)", background: managed ? "rgba(61,205,88,0.1)" : "rgba(226,76,76,0.1)" }}>{managed ? "Managed" : "Unmanaged"} highlighted</span>
            </div>
            <div className="sub">Green = Managed · Amber = ToU · Red = Unmanaged · dashed = ambient · +1d = tomorrow</div>
            <LineChart ylabel="°C" limit={110} ambient={pr.ambient} endHour={36}
              series={[
                { data: pr.unmanaged.hotSpot, color: managed ? "rgba(226,76,76,0.3)" : "#E24C4C" },
                { data: pr.tou ? pr.tou.hotSpot : [], color: "rgba(242,193,46,0.7)" },
                { data: pr.managed.hotSpot, color: managed ? "#5FE07A" : "rgba(95,224,122,0.35)" },
              ]} />
            <div style={{ marginTop: 10 }}>
              <div className="sub" style={{ marginBottom: 4 }}>EV charging kW · Unmanaged · ToU · Managed</div>
              <ChargeBar unmanagedKw={pr.unmanagedKw} managedKw={pr.managedKw} touKw={pr.touKw} step={step} />
            </div>
          </div>
          <div className="metric-grid">
            <div className={"mstat " + (managed ? "good" : "bad")}>
              <div className="n">{(managed ? pr.overLimitManaged : pr.overLimitUnmanaged).toFixed(1)} h</div>
              <div className="l">Time over 110°C limit</div></div>
            <div className={"mstat " + (pr.onTimeShare >= 0.95 ? "good" : "bad")}>
              <div className="n">{Math.round(pr.onTimeShare * 100)}%</div>
              <div className="l">Managed EV sessions on time</div></div>
            <div className="mstat good">
              <div className="n">{pr.lolSaved.toFixed(1)} h</div>
              <div className="l">Loss of life saved</div></div>
            <div className="mstat good">
              <div className="n">{pr.peakKwhShifted.toFixed(0)}</div>
              <div className="l">kWh shifted off peak</div></div>
          </div>
          <div className="card" style={{ marginTop: 14 }} data-testid="charging-audit">
            <h2>Charging delivery · by departure</h2>
            <div className="sub">36-hour simulation · oil temperature carries through midnight. Slot values are 15-minute average kW.</div>
            {[["unmanaged", "Unmanaged"], ["tou", "ToU"], ["managed", "Managed"]].map(([key, label]) =>
              <div key={key} className="reason" data-testid={`delivery-${key}`}>
                <b>{label}</b> · {(pr.energy[key].onTimeShare * 100).toFixed(0)}% on time<br />
                {pr.energy[key].deliveredKwh.toFixed(2)} / {pr.energy[key].requestedKwh.toFixed(2)} kWh delivered · {pr.energy[key].unmetKwh.toFixed(2)} kWh unmet
              </div>)}
            {pr.energy.managed.unmetKwh > 1e-6 && <div role="alert" className="callout" style={{ marginTop: 10 }}>Some charging demand is unmet. The scheduler preserves charger/window limits; it does not guarantee feasibility or thermal safety.</div>}
            <details style={{ marginTop: 12 }}>
              <summary>Inspect EV sessions ({pr.sessions})</summary>
              {pr.sessionReports.map(s => <div className="reason" key={s.id}>
                <b>{s.id}</b> · {s.maxKw.toFixed(1)} kW charger<br />
                Arrive {s.arrive.toFixed(2)} h · depart {s.depart.toFixed(2)} h from today's midnight<br />
                Managed: {s.managed.deliveredKwh.toFixed(2)} / {s.energy.toFixed(2)} kWh · {s.managed.onTime ? "On time" : "Unmet demand"}
              </div>)}
            </details>
            <div className="hint" style={{ marginTop: 10 }}>ToU charges only from 22:00 to 06:00 +1d. Tomorrow repeats today's assumed base load and weather. Thermal metrics cover the full 36 hours; unmet energy is excluded from shifted kWh.</div>
          </div>
        </div>
      </div></main></div>
    </>
  );
}

// ---------- Validate tab (TDD §15 validation experiments) ----------
function ValidateTab({ network }) {
  const [results, setResults] = React.useState(null);
  const [running, setRunning] = React.useState(false);

  function run() {
    setRunning(true); setResults(null);
    setTimeout(() => {
      try {
        const r = runValidation(network);
        setResults(r);
      } catch (e) {
        setResults([{ id: 'error', name: 'Error', description: String(e), passed: false, detail: e.stack || '' }]);
      }
      setRunning(false);
    }, 30); // yield to paint first
  }

  const passCount = results ? results.filter(r => r.passed).length : 0;

  return (
    <div className="wrap"><main>
      <div className="card prose" style={{ marginBottom: 16 }}>
        <h2>Prototype validation checks</h2>
        <p className="sub">Five smoke checks for thermal sanity, determinism, a greedy planning comparison,
          and sampled Protect outcomes. These run on the current synthetic network; they do not cover the full TDD §15 validation plan.</p>
        <button className="btn-primary" onClick={run} disabled={running} style={{ marginTop: 8 }}>
          {running ? 'Running validation…' : 'Run validation'}
        </button>
        {results && (
          <span style={{ marginLeft: 12, fontWeight: 700, color: passCount === results.length ? 'var(--pos)' : 'var(--neg)' }}>
            {passCount}/{results.length} passed
          </span>
        )}
      </div>

      {results && results.map(r => (
        <div key={r.id} className="card" style={{ marginBottom: 10, borderLeft: `3px solid ${r.passed ? 'var(--pos)' : 'var(--neg)'}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
            <span style={{
              background: r.passed ? 'rgba(61,205,88,0.15)' : 'rgba(226,76,76,0.15)',
              color: r.passed ? 'var(--pos)' : 'var(--neg)',
              border: `1px solid ${r.passed ? 'var(--pos)' : 'var(--neg)'}`,
              borderRadius: 4, padding: '1px 8px', fontSize: 11, fontWeight: 700, flexShrink: 0
            }}>{r.passed ? '✔ PASS' : '✘ FAIL'}</span>
            <strong style={{ fontSize: 14 }}>{r.name}</strong>
          </div>
          <div className="sub" style={{ marginBottom: 4 }}>{r.description}</div>
          <div style={{ fontSize: 11.5, color: 'var(--ink-2)', fontFamily: 'monospace', background: 'rgba(0,0,0,0.25)', padding: '4px 8px', borderRadius: 4 }}>{r.detail}</div>
        </div>
      ))}

      {!results && !running && (
        <div className="card" style={{ color: 'var(--ink-3)', textAlign: 'center', padding: 32 }}>
          Press “Run validation” to execute the 5 prototype checks.
        </div>
      )}
    </main></div>
  );
}

// ---------- Method tab ----------
function MethodTab() {
  return (
    <div className="wrap"><main><div className="card prose">
      <h2>What GreenTrafo does</h2>
      <p>GreenTrafo treats each distribution transformer's thermal life as a budget, and helps a DISCOM spend it
        before summer (Plan) and protect it during peak evenings (Protect). The goal is a greener, more reliable
        grid: fewer premature transformer failures, fewer diesel-backed outages, and more headroom for rooftop
        solar and EV charging.</p>

      <h2>Why this is a green problem</h2>
      <p>A 2026 CEA advisory says most summer load shedding comes from the distribution network, not generation, and
        that it is largely avoidable if vulnerable assets are found at least six months ahead. Keeping transformers
        alive longer avoids the embodied carbon of replacement units, avoids diesel-generator hours during outages,
        and lets neighbourhoods host more green generation and EVs.</p>

      <h2>How the numbers are produced</h2>
      <ul>
        <li><b>Feeder and loads</b> are generated from a seed: about 40 transformers, with evening air-conditioning
          peaks, EV sessions, and hidden (unsanctioned) load growth.</li>
        <li><b>Thermal model</b> is a discrete form of the IEEE C57.91 top-oil and hot-spot equations, giving an
          ageing acceleration factor and loss-of-life per transformer.</li>
        <li><b>Plan</b> searches action plans (upgrade, rebalance, mobile unit) with a multi-objective evolutionary
          optimiser, trading capex against overload hours and loss-of-life, and returns a Pareto front.
          Every action counts toward the rupee cap, alongside maximum upgrade and mobile-unit counts.
          The 80/90 rule uses the same cap and counts, prioritises highest loading, and skips unaffordable
          upgrades or uses an affordable mobile unit. Actual spending can differ between policies.
          Budget changes reuse a sample of the previous Pareto plans, repair them to the new limits,
          and run 20 generations instead of 60. Scenario changes and unchanged-setting reruns start fresh.
          Warm starts are deterministic for the same inputs and archive; a shorter search does not
          guarantee a better result than a fresh search.</li>
        <li><b>Growth forecast</b> fits p10 / median / p90 latent load growth from six synthetic historical
          seasonal readings per transformer, using prior peak, cooling share, EV count and neighbourhood-growth proxy.
          Plan uses p90 conservatively; the detail panel exposes the complete range. Coverage is measured on synthetic targets that share latent growth with the training history, not an independent test set.</li>
        <li><b>Plan to Protect</b>: “Use this plan in Protect” snapshots the selected actions and scenario.
          Upgrades change capacity; rebalance/mobile actions use the same approximate load relief as Plan.
          Selected plan and Without plan use identical p90 demand assumptions and seeded EV sessions.
          All charging baselines use the selected network. Removing the plan restores standalone demand;
          changing scenario or editing/re-running Plan clears the handoff. Snapshots last only until reload.</li>
        <li><b>Protect</b> shifts flexible EV and AC load and reports the resulting temperature and
          on-time share over 36 continuous hours, through tomorrow noon. Each EV's exact
          connection window bounds its 15-minute average charging power, including partial slots.
          All allocation passes share that EV's remaining slot capacity. ToU uses only 22:00–06:00
          next day. Oil state carries through midnight; tomorrow repeats today's assumed demand
          and weather. Unmet energy is reported, not counted as shifted energy. The greedy
          scheduler does not guarantee thermal safety or feasible delivery.</li>
      </ul>

      <h2>Assumptions and honest limits</h2>
      <table>
        <tr><th>Item</th><th>In this demo</th></tr>
        <tr><td>Data</td><td>All synthetic and seeded. No real DISCOM data is used.</td></tr>
        <tr><td>Growth forecast</td><td>Browser-based quantile regression trained and calibrated on synthetic historic readings. It demonstrates uncertainty-aware planning; production calibration needs real DISCOM history.</td></tr>
        <tr><td>Hot-spot temperature</td><td>Estimated from load with the thermal model, not measured.</td></tr>
        <tr><td>Thermal constants</td><td>Typical IEEE C57.91 values; absolute loss-of-life is approximate, so compare against the baseline rather than reading absolute lifetimes.</td></tr>
        <tr><td>Power flow</td><td>A lightweight load approximation, not full unbalanced power flow. The real system uses pandapower / OpenDSS.</td></tr>
        <tr><td>Control path</td><td>Protect is a proposed demand-response design; no live signal to chargers exists today.</td></tr>
        <tr><td>Green figures</td><td>Diesel share and end-of-life threshold are assumed parameters, shown on each figure.</td></tr>
      </table>

      <div className="callout">GreenTrafo complements Schneider's ADMS, DERMS and EVlink at the neighbourhood-transformer
        level. It does not duplicate outage restoration, crew dispatch or building-side load management, which those
        products already provide.</div>

      <h2>FAQ</h2>
      {[
        ["Why is all data synthetic?", "Real DISCOM load data is not publicly available and varies by utility. Synthetic seeded data lets us prove the method end-to-end, publish the full config, and reproduce every result — which a judge can verify. The production system (TDD §9) uses pandapower with calibrated CEA/BIS parameters."],
        ["How accurate is the thermal model?", "The IEEE C57.91 top-oil / hot-spot model is the industry standard. We use typical constants from the standard; absolute loss-of-life numbers are approximate. Always compare Plan vs baseline — relative improvements are reliable even if absolute figures have uncertainty."],
        ["Why NSGA-II and not a greedy heuristic?", "A greedy heuristic (the 80/90 rule) is the current practice — it is the baseline we beat. NSGA-II gives a Pareto front of 15–30 plans in ~240 ms, letting the planner choose their own capex-vs-reliability trade-off instead of accepting a single answer."],
        ["Why valley-filling instead of cvxpy for Protect?", "Valley-filling is a transparent greedy approximation. It respects individual charger power and exact session windows, carries thermal state across midnight, and reports unmet demand; it cannot guarantee thermal safety or feasible delivery. The TDD §11 describes the full cvxpy rolling-horizon MPC for production; this prototype shows the same outcome shape with a transparent greedy proxy."],
        ["How does GreenTrafo fit with Schneider's products?", "ADMS handles outage restoration and FLISR. DERMS manages DER dispatch at feeder level. EVlink manages building-side EV charging. GreenTrafo sits one step earlier: neighbourhood-transformer thermal life, pre-summer planning, and evening peak protection — none of which those products address."],
      ].map(([q, a]) => <Faq key={q} q={q} a={a} />)}
    </div></main></div>
  );
}

// ---------- dark cinematic hero ----------
function Particles() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    let raf, W, H, pts;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize() {
      W = c.width = c.offsetWidth * devicePixelRatio;
      H = c.height = c.offsetHeight * devicePixelRatio;
      const n = Math.min(90, Math.floor(c.offsetWidth / 16));
      pts = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.12 * devicePixelRatio,
        vy: (Math.random() - 0.5) * 0.12 * devicePixelRatio,
        r: (Math.random() * 1.6 + 0.4) * devicePixelRatio,
        a: Math.random() * 0.5 + 0.2,
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
        ctx.fillStyle = `rgba(61,205,88,${p.a})`; ctx.fill();
      }
      raf = requestAnimationFrame(draw);
    }
    resize(); window.addEventListener("resize", resize);
    if (reduce) { draw(); cancelAnimationFrame(raf); } else draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={ref} className="particles" aria-hidden="true" />;
}

// ---------- shell ----------
function App() {
  const [tab, setTab] = useState("plan");
  const [transferredPlan, setTransferredPlan] = useState(null);
  const [scenario, setScenario] = useState("hot");
  const network = useMemo(() => buildNetwork(42, 40), []);
  const appRef = useRef(null);

  function start(which) {
    if (which === "method") setTab("method");
    requestAnimationFrame(() => {
      const el = document.getElementById("app-root");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  return (
    <>
      <Hero onStart={start} />
      <div id="app-root" ref={appRef}>
        <header className="top"><div className="wrap"><div className="brand">
          <div className="mark">G</div>
          <div>
            <h1>GreenTrafo</h1>
            <div className="tag">Green thermal-life budgeting for grid reliability</div>
          </div>
          <div className="right">Yuva Yodha 2026 · Grid Reliability<br /><b>Greener grid, longer-lived transformers</b></div>
        </div></div></header>
        <nav className="tabs"><div className="wrap">
          <button aria-selected={tab === "plan"} onClick={() => setTab("plan")}>Plan</button>
          <button aria-selected={tab === "protect"} onClick={() => setTab("protect")}>Protect</button>
          <button aria-selected={tab === "method"} onClick={() => setTab("method")}>Method &amp; limits</button>
          <button aria-selected={tab === "validate"} onClick={() => setTab("validate")}>Validate</button>
        </div></nav>
        {tab === "plan" && <PlanTab network={network} scenario={scenario} setScenario={setScenario}
          onInvalidate={() => setTransferredPlan(null)} onTransfer={plan => {
            setTransferredPlan(plan); setTab("protect");
            requestAnimationFrame(() => appRef.current?.scrollIntoView({ block: "start" }));
          }} />}
        {tab === "protect" && <ProtectTab network={network} transferredPlan={transferredPlan} onClearPlan={() => setTransferredPlan(null)} />}
        {tab === "method" && <MethodTab />}
        {tab === "validate" && <ValidateTab network={network} />}
        <footer>GreenTrafo · simulated prototype · built for the Schneider Electric Yuva Yodha Energy Tech Hackathon 2026</footer>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
