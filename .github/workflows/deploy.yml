name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: bash -n scripts/deploy-vercel.sh
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build and health-check container
        run: REVISION="$GITHUB_SHA" docker compose up -d --build --wait --wait-timeout 90
      - name: Verify container release, headers and offline functionality
        run: npm run test:deployment
      - name: Whole website in Chromium against production container
        run: npm run test:browser
        env:
          BASE_URL: http://127.0.0.1:8080
      - name: Save tested deployment artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence
          path: /tmp/greentrafo-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down

  deploy:
    name: Stage, verify and promote
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: production-site
          path: dist/
      - run: npm install --global vercel@62.2.0
      - run: npx playwright install --with-deps chromium
      - name: Stage the tested artifact and promote only after checks pass
        run: bash scripts/deploy-vercel.sh
