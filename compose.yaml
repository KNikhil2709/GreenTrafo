services:
  web:
    build:
      context: .
      args:
        REVISION: ${REVISION:-local}
    image: greentrafo:${IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 1.0
